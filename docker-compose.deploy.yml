services:
  ai-service:
    image: ${IMAGE_PREFIX}/runcoach-ai-service:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${IMAGE_PREFIX}/runcoach-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in the deployment environment}
      AI_SERVICE_URL: http://ai-service:8000
      WEB_URL: ${WEB_URL:?WEB_URL must be set in the deployment environment}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL must be set in the deployment environment}
    ports:
      - "4000:4000"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${IMAGE_PREFIX}/runcoach-web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
