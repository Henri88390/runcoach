name: Deploy development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: pip install -r apps/ai-service/requirements.txt

      - name: Compile AI service
        run: python -m py_compile apps/ai-service/*.py

  publish:
    name: Build and publish images
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runcoach-api:${{ env.IMAGE_TAG }}

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runcoach-ai-service:${{ env.IMAGE_TAG }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.DEV_API_URL }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runcoach-web:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy development services
    needs: publish
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy deployment Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: docker-compose.deploy.yml
          target: ${{ secrets.DEV_DEPLOY_PATH }}

      - name: Pull and restart development services
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_PREFIX,IMAGE_TAG,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.deploy.yml pull
            IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            curl --fail --retry 10 --retry-delay 10 http://127.0.0.1:8000/health
            curl --fail --retry 10 --retry-delay 10 http://127.0.0.1:4000/health
            docker image prune -f

      - name: Smoke test development web
        run: curl --fail --retry 10 --retry-delay 10 "${{ vars.DEV_WEB_URL }}"

      - name: Smoke test development API
        run: curl --fail --retry 10 --retry-delay 10 "${{ vars.DEV_API_URL }}/health"
